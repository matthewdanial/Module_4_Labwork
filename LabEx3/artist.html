<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fafafa;
        }
        .artist-name {
            font-size: 2.5em;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
        }
        .portfolio-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
        .portfolio-card {
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .portfolio-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
        }
        .portfolio-title {
            font-weight: 600;
            margin-top: 8px;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div class="artist-name" id="artist-name"></div>

    <!-- Different template to Exercise 2 - shows an image, not just text -->
    <template id="portfolio-template">
        <div class="portfolio-card">
            <img class="portfolio-image" src="" alt="">
            <div class="portfolio-title"></div>
        </div>
    </template>

    <div class="portfolio-list" id="portfolio-list"></div>

    <script>
        // The artist data provided on the slide
        const artist = {
            name: "Van Gogh",
            portfolio: [
                { title: "portrait", url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image" },
                { title: "sky", url: "https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg" }
            ]
        };

        // Function to add one portfolio card, using the new template
        function addPortfolioCard(title, imageUrl) {
            // clone the template
            const template = document.getElementById("portfolio-template")
                .content.cloneNode(true);

            // populate the template
            template.querySelector('.portfolio-image').src = imageUrl;
            template.querySelector('.portfolio-image').alt = title;
            template.querySelector('.portfolio-title').innerText = title;

            // add it to the page
            document.querySelector('#portfolio-list')
                .appendChild(template);
        }

        // Show the artist's name at the top
        document.getElementById("artist-name").innerText = artist.name;

        // Loop through the artist's portfolio and create a card for each piece
        artist.portfolio.forEach(item => {
            addPortfolioCard(item.title, item.url);
        });
    </script>
</body>
</html>
